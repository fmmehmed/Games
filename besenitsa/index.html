<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бесеница • Познай думата</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#283d39;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:30px 20px}header{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#68796c}h1{font:normal clamp(45px,8vw,70px) Georgia,serif;margin:35px 0 10px}p{color:#728077;line-height:1.6}section{background:#fffdf7;border:1px solid #dfdfcf;border-radius:25px;padding:25px;margin-top:25px;box-shadow:0 15px 50px #283d3908}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}select,button{font:inherit;border:1px solid #d7ddcf;border-radius:10px;padding:12px;background:#fffdf7;color:#283d39}button{cursor:pointer}button:hover:not(:disabled){background:#e8eddf}button:focus-visible,select:focus-visible{outline:3px solid #d9a752}button:disabled{cursor:default;opacity:.6}.play{display:flex;align-items:center;justify-content:center;gap:45px;min-height:230px}.count{font:normal 38px Georgia;color:#b36e47}.count small{display:block;font:12px Arial;color:#738276;margin-top:10px}svg{width:180px;height:210px;stroke:#38564c;stroke-width:5;fill:none;stroke-linecap:round}.part{visibility:hidden}.word{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px 0 20px}.letter{width:36px;height:47px;text-align:center;font-size:28px;font-weight:bold;border-bottom:3px solid #a6b49d}.keyboard{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.keyboard button{font-weight:bold;padding:13px 0}.keyboard .yes{background:#d4e4ce;border-color:#9db895;opacity:1}.keyboard .no{background:#eee7df;color:#a79b90}#status{text-align:center;min-height:30px;font-weight:bold;color:#876331;margin:18px 0}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px}.primary{background:#31594c;color:white;border:0;padding:14px 24px}.primary:hover:not(:disabled){background:#244638}footer{text-align:center;margin:25px;color:#859080;font-size:12px}.hint{text-align:center;font-size:13px;margin:0}@media(max-width:550px){main{padding:22px 12px}section{padding:18px 12px}.play{gap:20px;min-height:200px}svg{width:145px;height:180px}.keyboard{grid-template-columns:repeat(6,1fr)}.letter{width:27px;font-size:24px}.bottom{font-size:12px}h1{margin-top:25px}}</style><main><header><span>✳ ИГРИ С ДУМИ</span><span>НА БЪЛГАРСКИ</span></header><h1>Всяка буква е следа.</h1><p>Избери клас и тема. Познай понятията по КМИТ и ИТ с помощта на подсказки.</p><section><div class="top"><strong>Бесеница</strong><label>Клас <select id="grade"><option>5. клас</option><option>6. клас</option><option>7. клас</option><option>8. клас</option><option>9. клас</option><option>10. клас</option></select></label><label>Тема <select id="category"></select></label></div><div class="play"><svg viewBox="0 0 200 230" aria-label="Рисунка на бесеница"><path d="M20 215H180M50 215V15H140V42"/><circle class="part" cx="140" cy="65" r="22"/><path class="part" d="M140 87V145"/><path class="part" d="M140 100L108 125"/><path class="part" d="M140 100L172 125"/><path class="part" d="M140 145L112 185"/><path class="part" d="M140 145L168 185"/></svg><div class="count"><span id="remaining">6</span><small>оставащи грешки</small></div></div><p class="hint" id="hint"></p><div class="word" id="word" aria-label="Дума за отгатване"></div><div id="keyboard" class="keyboard" aria-label="Българска азбука"></div><div id="status" role="status" aria-live="polite"></div><div class="bottom"><span><span id="wins">Познати думи: 0</span> · <strong id="score">Точки: 0</strong></span><button class="primary" id="new">Нова дума ↗</button></div></section><footer>Избери буква с мишката, с пръст или с българската клавиатура.</footer></main><script>
const words={"5. клас":{"Компютър и информация":[["КОМПЮТЪР","Електронна машина за обработване на информация"],["МОНИТОР","Устройство, което показва изображението"],["КЛАВИАТУРА","Устройство за въвеждане на текст"],["ПАПКА","Място за организиране на файлове"],["ФАЙЛ","Записана информация с име"],["ПАМЕТ","Служи за съхраняване на данни"]],"Интернет и общуване":[["БРАУЗЪР","Програма за разглеждане на уебстраници"],["ИМЕЙЛ","Електронно писмо"],["ПАРОЛА","Тайна комбинация за защита на профил"],["ПРИКАЧВАНЕ","Добавяне на файл към електронно писмо"],["ЛИНК","Препратка към друга страница"]],"Компютърно моделиране":[["СПРАЙТ","Обект или герой в Scratch"],["СЦЕНА","Място, където се изпълнява проектът в Scratch"],["БЛОК","Команда във визуалното програмиране"],["ЦИКЪЛ","Повтаряне на команди"],["АНИМАЦИЯ","Създава впечатление за движение"]]},"6. клас":{"Информация и файлове":[["БАЙТ","Мерна единица за количество информация"],["БИТ","Най-малката единица за информация"],["КИЛОБАЙТ","Единица за количество информация"],["АРХИВ","Файл, който може да съдържа компресирани файлове"],["РАЗШИРЕНИЕ","Част от името на файл, указваща неговия тип"]],"Документи и таблици":[["ТАБЛИЦА","Подрежда данни в редове и колони"],["КОЛОНА","Вертикална част на таблица"],["РЕД","Хоризонтална част на таблица"],["ФОРМАТИРАНЕ","Промяна на външния вид на текст"],["ПОДРАВНЯВАНЕ","Разполагане на текста спрямо полетата"]],"Програмиране и безопасност":[["УСЛОВИЕ","Проверка, от която зависи изпълнението на команда"],["АЛГОРИТЪМ","Последователност от стъпки за решаване на задача"],["ПРОМЕНЛИВА","Име за съхранявана стойност в програма"],["КИБЕРСИГУРНОСТ","Защита на системи и данни в цифрова среда"],["ФИШИНГ","Измамно съобщение за получаване на лични данни"]]},"7. клас":{"Компютърни системи":[["ПРОЦЕСОР","Изпълнява инструкциите на програмите"],["ОПЕРАЦИОННА СИСТЕМА","Управлява ресурсите на компютъра"],["ПРИЛОЖЕНИЕ","Програма за изпълнение на потребителска задача"],["МРЕЖА","Свързани устройства за обмен на данни"],["СЪРВЪР","Предоставя ресурси или услуги на други устройства"]],"Обработка на информация":[["ДИАГРАМА","Графично представяне на данни"],["ФОРМУЛА","Изчислителен израз в електронна таблица"],["КЛЕТКА","Пресечна точка на ред и колона"],["ПРЕЗЕНТАЦИЯ","Показване на информация чрез слайдове"],["ХИПЕРВРЪЗКА","Препратка към друг ресурс"]],"Моделиране и безопасност":[["РАЗКЛОНЕНИЕ","Избор между действия според условие"],["ПОВТОРЕНИЕ","Многократно изпълнение на действия"],["ПРОЦЕДУРА","Именувана група от команди"],["АВТОРСКО ПРАВО","Закрила на създателя на произведение"],["ДИГИТАЛНА СЛЕДА","Информацията, която оставяме онлайн"]]},"8. клас":{"Компютър и мрежи":[["ХАРДУЕР","Физическите компоненти на компютъра"],["СОФТУЕР","Програми и данни за работа с компютър"],["ПРОТОКОЛ","Правила за обмен на информация"],["АДРЕС","Използва се за идентифициране на ресурс или устройство"],["МАРШРУТИЗАТОР","Насочва трафика между компютърни мрежи"]],"Дигитални документи":[["ШАБЛОН","Готов образец за създаване на документ"],["СТИЛ","Набор от настройки за оформление"],["ФУНКЦИЯ","Готова операция за изчисления в таблица"],["ФИЛТЪР","Показва данните, които отговарят на условие"],["СОРТИРАНЕ","Подреждане на данни по признак"]],"Дигитална безопасност":[["ШИФРИРАНЕ","Преобразуване на данни за защита"],["АРХИВИРАНЕ","Създаване на резервно копие"],["ЗЛОВРЕДЕН СОФТУЕР","Програма, предназначена да причинява вреда"],["ПОВЕРИТЕЛНОСТ","Контрол върху достъпа до лична информация"],["ЛИЦЕНЗ","Условия за използване на софтуер"]]},"9. клас":{"Информация и технологии":[["ДВОИЧНА СИСТЕМА","Бройна система с цифрите нула и едно"],["ДЕСЕТИЧНА СИСТЕМА","Бройна система с основа десет"],["АЛГОРИТЪМ","Точна последователност от стъпки"],["ИНФОРМАЦИЯ","Данни, на които е придаден смисъл"],["ПОЗИЦИОНИРАНЕ","Определяне на местоположение"]],"Програмиране":[["ПРОМЕНЛИВА","Именувано място за стойност"],["МЕТОД","Именувана част от програма, която изпълнява задача"],["КЛАС","Шаблон за създаване на обекти"],["ОБЕКТ","Екземпляр на клас"],["УСЛОВИЕ","Определя кой клон от програмата се изпълнява"],["ЦИКЪЛ","Повтаря команди"]],"Мрежи и данни":[["БРАУЗЪР","Приложение за достъп до уебсайтове"],["СЪРВЪР","Предоставя услуги в мрежа"],["БАЗА ДАННИ","Организирана съвкупност от данни"],["ЗАЯВКА","Искане за извличане или обработка на данни"],["КИБЕРСИГУРНОСТ","Защита на системи и информация"]]},"10. клас":{"Бази данни":[["ТАБЛИЦА","Структура от редове и колони за съхранение на данни"],["ЗАПИС","Един ред от таблица в база данни"],["ПОЛЕ","Една колона от таблица в база данни"],["ЗАЯВКА","Използва се за извличане на определени данни"],["ФИЛТЪР","Показва само записите, които отговарят на условие"],["СОРТИРАНЕ","Подреждане на записи по определен признак"],["РЕЛАЦИЯ","Връзка между таблици"],["ФОРМУЛЯР","Интерфейс за въвеждане на данни"],["ОТЧЕТ","Представя подбрани данни"]],"Мрежи и сигурност":[["СЪРВЪР","Компютър, който предоставя услуги"],["ПРОТОКОЛ","Правила за обмен на данни"],["МАРШРУТИЗАТОР","Устройство, което насочва данните между мрежи"],["ЗАЩИТНА СТЕНА","Средство за контрол на мрежовия трафик"],["ШИФРИРАНЕ","Преобразуване на информация с цел защита"],["АРХИВИРАНЕ","Създаване на резервно копие"],["ФИШИНГ","Измама за получаване на поверителни данни"],["УДОСТОВЕРЯВАНЕ","Проверка на самоличността при вход"]],"Софтуер и разработка":[["АЛГОРИТЪМ","Последователност от стъпки"],["ПРОГРАМА","Инструкции, които компютърът изпълнява"],["ПРОМЕНЛИВА","Именувано място за стойност"],["ФУНКЦИЯ","Самостоятелна част от код"],["КОМПИЛАТОР","Превежда изходен код"],["ВЕРСИЯ","Състояние на софтуер в даден момент"],["ХРАНИЛИЩЕ","Място за файлове и история на проекта"],["ИНТЕРФЕЙС","Средство за взаимодействие със система"]]}};const alphabet='АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЬЮЯ';let word='',hint='',guessed=new Set(),errors=0,ended=false,wins=0,score=0,previous='';const el=id=>document.getElementById(id);function render(){el('remaining').textContent=6-errors;el('word').replaceChildren(...[...word].map(l=>{const s=document.createElement('span');s.className='letter';s.textContent=l===' '?' ':guessed.has(l)||ended?l:'';return s}));document.querySelectorAll('.part').forEach((p,i)=>p.style.visibility=i<errors?'visible':'hidden');for(const b of el('keyboard').children){b.disabled=ended||guessed.has(b.textContent);b.className=guessed.has(b.textContent)?word.includes(b.textContent)?'yes':'no':''}el('wins').textContent='Познати думи: '+wins;el('score').textContent='Точки: '+score}function guess(l){if(ended||guessed.has(l)||!alphabet.includes(l))return;guessed.add(l);if(!word.includes(l)){errors++;score=Math.max(0,score-1)}if([...word].every(c=>c===' '||guessed.has(c))){ended=true;wins++;score+=10;el('status').textContent='Браво! +10 точки за познатата дума! ✨'}else if(errors===6){ended=true;el('status').textContent='Думата беше „'+word+'“. Опитай пак!'}render()}function updateCategories(){const select=el('category');select.replaceChildren(...Object.keys(words[el('grade').value]).map(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;return option}));previous='';newGame()}function newGame(){const list=words[el('grade').value][el('category').value].filter(x=>x[0]!==previous);[word,hint]=list[Math.floor(Math.random()*list.length)];previous=word;guessed=new Set();errors=0;ended=false;el('hint').textContent='Подсказка: '+hint;el('status').textContent='Избери първата си буква.';render()}for(const l of alphabet){const b=document.createElement('button');b.textContent=l;b.onclick=()=>guess(l);b.setAttribute('aria-label','Буква '+l);el('keyboard').append(b)}el('new').onclick=newGame;el('category').onchange=()=>{previous='';newGame()};el('grade').onchange=updateCategories;document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='SELECT')return;if(e.key.length===1)guess(e.key.toLocaleUpperCase('bg'))});updateCategories();
